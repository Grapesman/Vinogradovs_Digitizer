name: Build Windows release

on:
  workflow_dispatch:

  push:
    tags:
      - "v*"

permissions:
  contents: write


env:
  APP_VERSION: "2.3.0"
  APP_NAME: "Vinogradov's Digitizer"

  DIST_DIR: "dist\\VinogradovsDigitizer"

  INSTALLER_NAME: "Vinogradovs_Digitizer_Setup_2.3.0.exe"
  PORTABLE_NAME: "Vinogradovs_Digitizer_Portable_2.3.0.zip"


jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest

    timeout-minutes: 60

    steps:

      # -------------------------------------------------------
      # 1. Repository
      # -------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # -------------------------------------------------------
      # 2. Python
      # -------------------------------------------------------

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt


      # -------------------------------------------------------
      # 3. Python dependencies
      # -------------------------------------------------------

      - name: Upgrade pip
        shell: powershell
        run: |
          python -m pip install --upgrade pip


      - name: Install build dependencies
        shell: powershell
        run: |
          python -m pip install -r requirements-build.txt


      # -------------------------------------------------------
      # 4. Automated tests
      # -------------------------------------------------------

      - name: Run tests
        shell: powershell
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
        run: |
          python -m pytest tests -q


      # -------------------------------------------------------
      # 5. Clean previous output
      # -------------------------------------------------------

      - name: Clean build directories
        shell: powershell
        run: |
          if (Test-Path "build") {
              Remove-Item "build" -Recurse -Force
          }

          if (Test-Path "dist") {
              Remove-Item "dist" -Recurse -Force
          }

          if (Test-Path "release") {
              Remove-Item "release" -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "release" `
            | Out-Null


      # -------------------------------------------------------
      # 6. PyInstaller
      # -------------------------------------------------------

      - name: Build VinogradovsDigitizer.exe
        shell: powershell
        run: |
          python -m PyInstaller `
            --clean `
            --noconfirm `
            VinogradovsDigitizer.spec


      # -------------------------------------------------------
      # 7. Verify EXE
      # -------------------------------------------------------

      - name: Verify application build
        shell: powershell
        run: |
          $exe = "dist\VinogradovsDigitizer\VinogradovsDigitizer.exe"

          if (-not (Test-Path $exe)) {
              throw "VinogradovsDigitizer.exe was not created."
          }

          $file = Get-Item $exe

          Write-Host ""
          Write-Host "Application:"
          Write-Host $file.FullName
          Write-Host ""
          Write-Host "Size:"
          Write-Host $file.Length
          Write-Host ""


      # -------------------------------------------------------
      # 8. Portable ZIP
      # -------------------------------------------------------

      - name: Build portable ZIP
        shell: powershell
        run: |
          Compress-Archive `
            -Path "dist\VinogradovsDigitizer\*" `
            -DestinationPath "release\${{ env.PORTABLE_NAME }}" `
            -CompressionLevel Optimal `
            -Force


      # -------------------------------------------------------
      # 9. Inno Setup
      # -------------------------------------------------------

      - name: Install Inno Setup 6
        shell: powershell
        run: |
          choco install innosetup `
            --yes `
            --no-progress


      # -------------------------------------------------------
      # 10. Installer
      # -------------------------------------------------------

      - name: Build Windows installer
        shell: powershell
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"

          if (-not (Test-Path $iscc)) {
              $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe"
          }

          if (-not (Test-Path $iscc)) {
              throw "Inno Setup compiler ISCC.exe was not found."
          }

          & $iscc "installer\VinogradovsDigitizer.iss"

          if ($LASTEXITCODE -ne 0) {
              throw "Inno Setup compilation failed."
          }


      # -------------------------------------------------------
      # 11. Verify installer
      # -------------------------------------------------------

      - name: Verify installer
        shell: powershell
        run: |
          $installer = "release\${{ env.INSTALLER_NAME }}"

          if (-not (Test-Path $installer)) {
              throw "Windows installer was not created."
          }

          $file = Get-Item $installer

          Write-Host ""
          Write-Host "Installer:"
          Write-Host $file.FullName
          Write-Host ""
          Write-Host "Size:"
          Write-Host $file.Length
          Write-Host ""


      # -------------------------------------------------------
      # 12. SHA-256
      # -------------------------------------------------------

      - name: Generate SHA256 checksums
        shell: powershell
        run: |
          $files = @(
              "release\${{ env.INSTALLER_NAME }}",
              "release\${{ env.PORTABLE_NAME }}"
          )

          $lines = foreach ($file in $files) {
              if (-not (Test-Path $file)) {
                  throw "Release file was not found: $file"
              }

              $hash = Get-FileHash `
                  -Algorithm SHA256 `
                  -Path $file

              "{0}  {1}" -f `
                  $hash.Hash.ToLower(), `
                  (Split-Path $file -Leaf)
          }

          $lines | Set-Content `
              -Encoding ASCII `
              "release\SHA256SUMS.txt"

          Write-Host ""
          Write-Host "SHA256:"
          Get-Content "release\SHA256SUMS.txt"
          Write-Host ""


      # -------------------------------------------------------
      # 13. Show release contents
      # -------------------------------------------------------

      - name: Show release files
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=============================================="
          Write-Host " Vinogradov's Digitizer ${{ env.APP_VERSION }}"
          Write-Host " Windows release"
          Write-Host "=============================================="
          Write-Host ""

          Get-ChildItem "release" |
            Format-Table Name, Length

          Write-Host ""


      # -------------------------------------------------------
      # 14. GitHub Actions artifact
      # -------------------------------------------------------
      #
      # Создаётся всегда:
      # - при ручном запуске workflow;
      # - при создании тега.
      #
      # Благодаря этому мы сначала сможем протестировать сборку
      # без публикации официального Release.
      # -------------------------------------------------------

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vinogradovs-Digitizer-Windows-${{ env.APP_VERSION }}

          if-no-files-found: error

          retention-days: 30

          path: |
            release/${{ env.INSTALLER_NAME }}
            release/${{ env.PORTABLE_NAME }}
            release/SHA256SUMS.txt


      # -------------------------------------------------------
      # 15. GitHub Release
      # -------------------------------------------------------
      #
      # Этот этап запускается ТОЛЬКО при push тега:
      #
      #     v2.3.0
      #
      # Обычный workflow_dispatch не публикует релиз.
      # -------------------------------------------------------

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"

          $installer = "release\${{ env.INSTALLER_NAME }}"
          $portable = "release\${{ env.PORTABLE_NAME }}"
          $checksums = "release\SHA256SUMS.txt"

          $releaseExists = $false

          gh release view $tag 2>$null

          if ($LASTEXITCODE -eq 0) {
              $releaseExists = $true
          }

          if ($releaseExists) {

              Write-Host ""
              Write-Host "Release $tag already exists."
              Write-Host "Replacing release assets..."
              Write-Host ""

              gh release upload `
                $tag `
                $installer `
                $portable `
                $checksums `
                --clobber

              if ($LASTEXITCODE -ne 0) {
                  throw "Failed to upload files to existing GitHub Release."
              }

          }
          else {

              Write-Host ""
              Write-Host "Creating GitHub Release $tag..."
              Write-Host ""

              gh release create `
                $tag `
                $installer `
                $portable `
                $checksums `
                --title "Vinogradov's Digitizer ${{ env.APP_VERSION }}" `
                --generate-notes

              if ($LASTEXITCODE -ne 0) {
                  throw "Failed to create GitHub Release."
              }
          }


      # -------------------------------------------------------
      # 16. Final information
      # -------------------------------------------------------

      - name: Build summary
        shell: powershell
        run: |
          @"
          # Vinogradov's Digitizer ${{ env.APP_VERSION }}

          Windows build completed successfully.

          ## Normal installation

          **${{ env.INSTALLER_NAME }}**

          This is the recommended file for end users.

          ## Portable build

          **${{ env.PORTABLE_NAME }}**

          No installation is required.

          ## Requirements for end users

          - Windows 10/11 x64
          - Python is not required
          - Docker is not required
          - OpenCV does not need to be installed separately
          - PySide6 does not need to be installed separately

          ## Integrity

          SHA-256 checksums are available in:

          **SHA256SUMS.txt**
          "@ | Add-Content $env:GITHUB_STEP_SUMMARY